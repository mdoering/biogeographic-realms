[project]
name = "biogeographic-realms"
version = "0.1.0"
description = "Global biogeographic realms derived from GBIF occurrences"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
  "geopandas>=1.0",
  "infomap>=2.16,<3",
  "matplotlib>=3.9",
  "numpy>=2.0",
  "polars>=1.0",
  "scikit-learn>=1.5",
  "scipy>=1.14",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/realms"]

[tool.pytest.ini_options]
testpaths = ["tests"]
